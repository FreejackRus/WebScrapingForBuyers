server {
    listen 80;
    server_name _;

    location /price-radar/api/ {
        proxy_pass http://gateway:3001/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 180s;
    }

    location = /price-radar/ {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location /price-radar/ {
        rewrite ^/price-radar/(.*)$ /$1 break;
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }

    location = /health {
        access_log off;
        return 200 "ok\n";
    }
}
